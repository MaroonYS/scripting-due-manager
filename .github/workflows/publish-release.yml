name: Publish latest Scripting package

on:
  push:
    branches:
      - main
    paths:
      - "到期管家.scripting"
      - "到期管家/script.json"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-due-manager
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and prepare package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -er '.version | select(type == "string" and length > 0)' '到期管家/script.json')"
          packaged_version="$(unzip -p '到期管家.scripting' script.json | jq -er '.version')"
          test "$version" = "$packaged_version"

          cp '到期管家.scripting' due-manager.scripting
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "title=到期管家 v${version}" >> "$GITHUB_OUTPUT"

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_TITLE: ${{ steps.package.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --target "$GITHUB_SHA" \
              --latest
            gh release upload "$RELEASE_TAG" due-manager.scripting --clobber
          else
            gh release create "$RELEASE_TAG" due-manager.scripting \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --latest
          fi
